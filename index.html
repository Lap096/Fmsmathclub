    <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
    }

    .card {
        background: rgba(0, 0, 0, 0.85);
        padding: 40px;
        border-radius: 12px;
        width: 380px;
        text-align: center;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 6px;
        background: #1c1c1c;
        color: white;
    }

    button {

        margin-top: 12px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4CAF50;
        color: white;
        font-size: 14px;
        cursor: pointer;
        transition: .2s;
    }

    button:hover {
        background: #45a049;
        transform: scale(1.02);
    }

        color: #ff4d4d;

        display: none;
    }

        color: orange;
        margin-top: 10px;

    }

    }

    }

        margin-top: 12px;

    }

        max-height: 60vh;
        overflow-y: auto;
        margin-top: 10px;
    }

    <div id="loginBox" class="card">
        <h2>Account Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="checkLogin()">Sign In</button>
        <div id="error">Invalid username or password</div>
        <div id="lockMsg">Too many attempts. Try again later.</div>
    </div>
    <script>
    /* =========================
      HASH + SALT
    ========================= */
    const SALT = "8fj29f92jf";
    async function sha256(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text + SALT);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    /* =========================
      USERS
    ========================= */
    const DEFAULT_USERS = {
        "xy13k": "sppe89e76501525074",
        "blboi": "poopfire13"
    };
    let users = JSON.parse(localStorage.getItem("users") || "null");
    async function initializeUsers() {
        if (!users) {
            users = {};
            for (const u in DEFAULT_USERS) {
                users[u] = await sha256(DEFAULT_USERS[u]);
            }
            localStorage.setItem("users", JSON.stringify(users));
        }
    }
    initializeUsers();
    /* =========================
      LOGIN SYSTEM
    ========================= */
    let attempts = localStorage.getItem("loginAttempts") || 0;
    let lockTime = localStorage.getItem("lockTime") || 0;
    async function checkLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const hash = await sha256(password);
        const now = Date.now();
        /* OWNER BYPASS */
        if (username === "bypass" && password === "6501525074") {
            localStorage.setItem("loginAttempts", 0);
            localStorage.removeItem("lockTime");
            createSession(username);
            showOwnerPanel();
            return;
        }
        /* MOMMU BYPASS LOCK */
        if (username === "mommu_altt" && password === "chicken13") {
            localStorage.setItem("loginAttempts", 0);
            localStorage.removeItem("lockTime");
            createSession(username);
            alert("caden you little fart its not that hard");
            showLauncher();
            return;
        }
        /* LOCK CHECK */
        if (lockTime && now < lockTime) {
            document.getElementById("lockMsg").style.display = "block";
            return;
        }
        /* NORMAL LOGIN */
        if (users[username] && users[username] === hash) {
            localStorage.setItem("loginAttempts", 0);
            createSession(username);
            showLauncher();
        } else {
            attempts++;
            localStorage.setItem("loginAttempts", attempts);
            document.getElementById("error").style.display = "block";
            if (attempts >= 3) {
                const oneHour = 60 * 60 * 1000;
                const newLock = Date.now() + oneHour;
                localStorage.setItem("lockTime", newLock);
                document.getElementById("lockMsg").style.display = "block";
            }
        }
        setTimeout(() => document.getElementById("error").style.display = "none", 2000);
    }
    /* =========================
      SESSION
    ========================= */
    function createSession(user) {
        const token = crypto.getRandomValues(new Uint32Array(4)).join("-");
        sessionStorage.setItem("sessionUser", user);
        sessionStorage.setItem("sessionToken", token);
    }
    function validateSession() {
        const user = sessionStorage.getItem("sessionUser");
        const token = sessionStorage.getItem("sessionToken");
        if (!user || !token)
            location.reload();
    }
    /* =========================
      OWNER PANEL
    ========================= */
    function showOwnerPanel() {
        validateSession();
        document.body.innerHTML = `
<div class="card">
<h2>Owner Panel</h2>
<input id="newUser" placeholder="New username">
<input id="newPass" type="password" placeholder="New password">
<button class="ownerBtn" onclick="addUser()">Add User</button>
<input id="delUser" placeholder="Username to delete">
<button class="ownerBtn" onclick="deleteUser()">Delete User</button>
<button class="ownerBtn" onclick="viewUsers()">View All Users</button>
<div class="userList" id="userList"></div>
<button onclick="showLauncher()">Go to Launcher</button>
</div>
`











        ;
    }
    async function addUser() {
        const u = document.getElementById("newUser").value;
        const p = document.getElementById("newPass").value;
        if (!u || !p) {
            alert("Enter username and password");
            return;
        }
        if (users[u]) {
            alert("User exists");
            return;
        }
        users[u] = await sha256(p);
        localStorage.setItem("users", JSON.stringify(users));
        alert("User added");
    }
    function deleteUser() {
        const u = document.getElementById("delUser").value;
        if (users[u]) {
            delete users[u];
            localStorage.setItem("users", JSON.stringify(users));
            alert("caden you little fart its not that hard");
        }
    }
    function viewUsers() {
        document.getElementById("userList").innerHTML =
        Object.keys(users).map(u => u + " : [hashed]").join("<br>");
    }

    /* =========================

    ========================= */
    function showLaunchScreen() {
        document.body.innerHTML = `<div class="card"><h2>Launching Client</h2></div>`;
    }
    async function loadClient(urls) {
        setTimeout(async () => {
            let fullHtml = "";
            for (const u of urls) {
                const res = await fetch(u);
                fullHtml += await res.text();
            }
            document.open();
            document.write(fullHtml);
            document.close();
        }, 1500);
    }
