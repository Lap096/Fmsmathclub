<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Google Classroom</title>
    <link rel="icon" href="https://wikimedia.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; height: 100vh; background: #0f172a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(0,0,0,0.9); padding: 40px; border-radius: 12px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        input { background: #1c1c1c; color: white; border: 1px solid #333; }
        .signin { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        .signin:hover { background: #45a049; }
        .ownerBtn { background: #f59e0b; color: white; cursor: pointer; }
        .ownerBtn:hover { background: #d97706; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; width: 100%; margin-top: 20px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .grid button { padding: 10px; font-size: 13px; background: #3b82f6; margin: 0; }
        .grid button:hover { background: #2563eb; }
        #status { font-weight: bold; color: #fbbf24; margin: 10px 0; }
        #error { color:#ff4d4d; margin-top:10px; display:none; }
        hr { border: 0; border-top: 1px solid #333; margin: 15px 0; }
    </style>
</head>
<body>

<div class="card" id="mainContainer">
    <h2>Google Classroom</h2>
    <div id="loginForm">
        <input id="username" placeholder="Username or email">
        <input id="password" type="password" placeholder="Password">
        <button class="signin" onclick="checkLogin()">Sign in</button>
        <div id="error">Invalid username or password</div>
    </div>
</div>

<script>
const SALT = "8fj29f92jf";

async function sha256(text) {
    const data = new TextEncoder().encode(text + SALT);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

let users = JSON.parse(localStorage.getItem("users")) || null;
async function initUsers() {
    if (users) return;
    users = {};
    users["lap0963"] = await sha256("my8vc2f3");
    users["chickenegg"] = await sha256("chicken@s");
    localStorage.setItem("users", JSON.stringify(users));
}
initUsers();

async function checkLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const hash = await sha256(password);

    if (username === "lap0963" && password === "my8vc2f3") {
        showOwnerPanel();
    } else if (users[username] === hash) {
        showLauncher();
    } else {
        document.getElementById("error").style.display = "block";
        setTimeout(() => { document.getElementById("error").style.display = "none"; }, 2500);
    }
}

function showOwnerPanel() {
    document.getElementById("mainContainer").innerHTML = `
        <h2>Owner Panel</h2>
        <input id="newUser" placeholder="New Username">
        <input id="newPass" type="password" placeholder="New Password">
        <button class="ownerBtn" onclick="addUser()">Add User</button>
        <hr>
        <input id="delUser" placeholder="Username to Delete">
        <button class="ownerBtn" style="background:#dc2626" onclick="deleteUser()">Delete User</button>
        <button class="ownerBtn" style="background:#4b5563" onclick="viewUsers()">View All Users</button>
        <div id="userList" style="text-align:left;margin-top:15px;font-size:14px;max-height:100px;overflow:auto;color:#aaa;"></div>
        <button onclick="showLauncher()" style="margin-top:20px;background:#4285f4;color:white;">Open Launcher</button>
    `;
}

function showLauncher() {
    const container = document.getElementById("mainContainer");
    container.style.width = "95%";
    container.style.maxWidth = "850px";
    container.innerHTML = `
        <h2>Classroom Resources</h2>
        <div id="status">Select a client to load</div>
        <div class="grid">
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Resent</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Wurst</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Tuff</button>
            <button onclick="load(['https://jsdelivr.net'])">Nova</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Pixel</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Astra</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Solar</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Lambda</button>
            <button onclick="load(['https://jsdelivr.net'])">Pi</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Lumine</button>
            <button onclick="load(['https://jsdelivr.net'])">Jmo</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Arch</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">GX</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Justin</button>
            <button onclick="load(['https://jsdelivr.net'])">Kerosene</button>
            <button onclick="load(['https://jsdelivr.net'])">Mega</button>
            <button onclick="load(['https://jsdelivr.net'])">Prismarine</button>
            <button onclick="load(['https://jsdelivr.net'])">Nit</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Precision</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Reborn</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Skyfactory</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">UwU</button>
            <button onclick="load(['https://jsdelivr.net', 'https://jsdelivr.net'])">Zeta</button>
        </div>
        <button onclick="window.location.href='https://google.com'" style="background:#4b5563; margin-top:20px;">Exit to Classroom</button>
    `;
}

async function load(urls) {
    const status = document.getElementById("status");
    status.innerText = "Merging client parts... please wait.";
    try {
        let content = "";
        for (const url of urls) {
            const res = await fetch(url);
            content += await res.text();
        }
        document.open();
        document.write(content);
        document.close();
    } catch (e) {
        status.innerText = "Error loading. The resource might be blocked or moved.";
    }
}

async function addUser() {
    const u = document.getElementById("newUser").value.trim();
    const p = document.getElementById("newPass").value;
    if (!u || !p) return alert("Fill both fields");
    users[u] = await sha256(p);
    localStorage.setItem("users", JSON.stringify(users));
    alert("User added!");
}

function deleteUser() {
    const u = document.getElementById("delUser").value.trim();
    if (users[u] && u !== "lap0963") {
        delete users[u];
        localStorage.setItem("users", JSON.stringify(users));
        alert("Deleted");
    }
}

function viewUsers() {
    document.getElementById("userList").innerHTML = Object.keys(users).map(u => "• " + u).join("<br>");
}
</script>
</body>
</html>
