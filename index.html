<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Classroom</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/5/59/Google_Classroom_Logo.png">
    <style>
:root {
    --google-green: #1e8e3e;
    --google-blue: #1a73e8;
    --google-yellow: #f9ab00;
    --bg-dark: #121212;
    --card-bg: #1e1e1e;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    /* Soft dark radial gradient */
    background: radial-gradient(circle at center, #1a2a20 0%, #0a0a0a 100%);
    color: #eeeeee;
}

.card {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 12px;
    width: 380px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    border-top: 5px solid var(--google-green); /* Adds that Classroom look */
}

h2 {
    font-weight: 500;
    margin-bottom: 25px;
    color: #ffffff;
}

input {
    width: 100%;
    box-sizing: border-box; /* Prevents input from sticking out */
    padding: 14px;
    margin-top: 15px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #2a2a2a;
    color: white;
    font-size: 15px;
    transition: border 0.3s;
}

input:focus {
    outline: none;
    border-color: var(--google-green);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--google-green);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover {
    background: #2d9e4c;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(1px);
}

.clientBtn {
    background: var(--google-blue);
    margin-bottom: 10px;
}

.clientBtn:hover {
    background: #1557b0;
}

.ownerBtn {
    background: var(--google-yellow);
    color: #202124; /* Dark text for better contrast on yellow */
    margin-bottom: 10px;
}

.ownerBtn:hover {
    background: #f4b400;
}

#error { color: #ff5252; margin-top: 15px; font-weight: bold; display: none; }
#lockMsg { color: var(--google-yellow); margin-top: 15px; display: none; }

.scroll {
    max-height: 55vh;
    overflow-y: auto;
    margin-top: 15px;
    padding-right: 5px;
}

/* Custom scrollbar to match the dark theme */
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
</style>

</head>
<body>
    <div id="loginBox" class="card">
        <h2>Account Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="checkLogin()">Sign In</button>
        <div id="error">Invalid username or password</div>
        <div id="lockMsg">Too many attempts. Try again later.</div>
    </div>
    <script>
    /* =========================
      HASH + SALT
    ========================= */
    const SALT = "8fj29f92jf";
    async function sha256(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text + SALT);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    /* =========================
      USERS
    ========================= */
    const DEFAULT_USERS = {
        "xy13k": "sppe89e76501525074",
        "blboi": "poopfire13"
    };
    let users = JSON.parse(localStorage.getItem("users") || "null");
    async function initializeUsers() {
        if (!users) {
            users = {};
            for (const u in DEFAULT_USERS) {
                users[u] = await sha256(DEFAULT_USERS[u]);
            }
            localStorage.setItem("users", JSON.stringify(users));
        }
    }
    initializeUsers();
    /* =========================
      LOGIN SYSTEM
    ========================= */
    let attempts = localStorage.getItem("loginAttempts") || 0;
    let lockTime = localStorage.getItem("lockTime") || 0;
    async function checkLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const hash = await sha256(password);
        const now = Date.now();
        /* OWNER BYPASS */
        if (username === "owner" && password === "my8vc2f3") {
            localStorage.setItem("loginAttempts", 0);
            localStorage.removeItem("lockTime");
            createSession(username);
            showOwnerPanel();
            return;
        }
        /* MOMMU BYPASS LOCK */
        if (username === "mommu_altt" && password === "chicken13") {
            localStorage.setItem("loginAttempts", 0);
            localStorage.removeItem("lockTime");
            createSession(username);
            alert("U did it!! -Brad");
            showLauncher();
            return;
        }
        /* LOCK CHECK */
        if (lockTime && now < lockTime) {
            document.getElementById("lockMsg").style.display = "block";
            return;
        }
        /* NORMAL LOGIN */
        if (users[username] && users[username] === hash) {
            localStorage.setItem("loginAttempts", 0);
            createSession(username);
            showLauncher();
        } else {
            attempts++;
            localStorage.setItem("loginAttempts", attempts);
            document.getElementById("error").style.display = "block";
            if (attempts >= 3) {
                const oneHour = 60 * 60 * 1000;
                const newLock = Date.now() + oneHour;
                localStorage.setItem("lockTime", newLock);
                document.getElementById("lockMsg").style.display = "block";
            }
        }
        setTimeout(() => document.getElementById("error").style.display = "none", 2000);
    }
    /* =========================
      SESSION
    ========================= */
    function createSession(user) {
        const token = crypto.getRandomValues(new Uint32Array(4)).join("-");
        sessionStorage.setItem("sessionUser", user);
        sessionStorage.setItem("sessionToken", token);
    }
    function validateSession() {
        const user = sessionStorage.getItem("sessionUser");
        const token = sessionStorage.getItem("sessionToken");
        if (!user || !token)
            location.reload();
    }
    /* =========================
      OWNER PANEL
    ========================= */
    function showOwnerPanel() {
        validateSession();
        document.body.innerHTML = `
<div class="card">
<h2>Owner Panel</h2>
<input id="newUser" placeholder="New username">
<input id="newPass" type="password" placeholder="New password">
<button class="ownerBtn" onclick="addUser()">Add User</button>
<input id="delUser" placeholder="Username to delete">

<button class="ownerBtn" onclick="viewUsers()">View All Users</button>
<div class="userList" id="userList"></div>
<button onclick="showLauncher()">Go to Launcher</button>
</div>
`











        ;
    }
    async function addUser() {
        const u = document.getElementById("newUser").value;
        const p = document.getElementById("newPass").value;
        if (!u || !p) {
            alert("Enter username and password");
            return;
        }
        if (users[u]) {
            alert("User exists");
            return;
        }
        users[u] = await sha256(p);
        localStorage.setItem("users", JSON.stringify(users));
        alert("User added");
    }
    function deleteUser() {
        const u = document.getElementById("delUser").value;
        if (users[u]) {
            delete users[u];
            localStorage.setItem("users", JSON.stringify(users));
            alert("caden you little fart its not that hard");
        }
    }
    function viewUsers() {
        document.getElementById("userList").innerHTML =
        Object.keys(users).map(u => u + " : [hashed]").join("<br>");
    }

    /* =========================

    ========================= */
    function showLaunchScreen() {
        document.body.innerHTML = `<div class="card"><h2>Launching Client</h2></div>`;
    }
    async function loadClient(urls) {
        setTimeout(async () => {
            let fullHtml = "";
            for (const u of urls) {
                const res = await fetch(u);
                fullHtml += await res.text();
            }
            document.open();
            document.write(fullHtml);
            document.close();
        }, 1500);
    }
